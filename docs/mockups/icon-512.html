<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }

  /* Roblox-native fonts: Enum.Font.LuckiestGuy / Enum.Font.FredokaOne */
  body { width:1500px; background:#150d2b; padding:34px;
         font-family:"Fredoka One","Segoe UI",Arial,sans-serif; color:#fff; }

  /* ---- palette ----
     ink   #1A0F2E   panel #3A2A66   panel2 #523D8F
     gold  #FFC93C   green #3DDC5B   red   #FF3B3B   blue #35B7FF        */

  .disp { font-family:"Luckiest Guy",Impact,sans-serif; letter-spacing:1px; }
  .out  { -webkit-text-stroke:6px #1A0F2E; paint-order:stroke fill; }
  .out3 { -webkit-text-stroke:3px #1A0F2E; paint-order:stroke fill; }
  .out4 { -webkit-text-stroke:4px #1A0F2E; paint-order:stroke fill; }

  .hdr { display:flex; align-items:center; gap:18px; padding-bottom:14px; margin-bottom:6px;
         border-bottom:5px solid #1A0F2E; }
  .hdr h1 { font-size:38px; color:#FFC93C; }
  .hdr .t { font-size:15px; color:#a99bd4; }
  .hdr .n { margin-left:auto; font-size:13px; color:#6f639b; }

  .lbl { font-size:20px; color:#FFC93C; margin:28px 0 3px 0; }
  .sub { font-size:14px; color:#a99bd4; margin-bottom:13px; }
  .row { display:flex; gap:22px; }

  /* ============ shared chunky UI atoms ============ */
  .panel { background:#3A2A66; border:5px solid #1A0F2E; border-radius:18px; }
  .btn { border:4px solid #1A0F2E; border-radius:14px; text-align:center;
         font-family:"Luckiest Guy",Impact,sans-serif; letter-spacing:1px; }
  .b-gold  { background:linear-gradient(#FFDD73,#FFAE18); color:#3A2200; box-shadow:0 6px 0 #A96D00; }
  .b-green { background:linear-gradient(#6BF08A,#22B845); color:#0B3D19; box-shadow:0 6px 0 #147A2C; }
  .b-red   { background:linear-gradient(#FF7A7A,#E01F1F); color:#fff;    box-shadow:0 6px 0 #8E0F0F; }
  .b-blue  { background:linear-gradient(#7FD4FF,#1E9AE0); color:#04314B; box-shadow:0 6px 0 #0F6296; }

  .screen { border:6px solid #1A0F2E; border-radius:20px; overflow:hidden; position:relative; }

  /* bright saturated Roblox night, not a moody web app */
  .world { position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 96%, rgba(255,201,60,.34), transparent 58%),
      radial-gradient(circle at 16% 16%, rgba(126,90,240,.55), transparent 52%),
      linear-gradient(#5B3FB5 0%, #46309A 40%, #331F73 72%, #241552 100%); }
  .star { position:absolute; width:5px; height:5px; background:#fff; border-radius:50%; opacity:.85; }
  .moon { position:absolute; top:26px; right:96px; width:54px; height:54px; border-radius:50%;
          background:#FFF3C4; box-shadow:0 0 40px rgba(255,243,196,.75); }
  .hill { position:absolute; left:-6%; right:-6%; bottom:0; height:26%;
          background:#2B1A5E; border-top:5px solid #1A0F2E; border-radius:50% 50% 0 0/22% 22% 0 0; }
  .mans { position:absolute; left:50%; transform:translateX(-50%); bottom:19%; width:330px; height:132px;
          background:#6E4FC7; border:5px solid #1A0F2E; border-radius:8px; }
  .mans .roof { position:absolute; top:-30px; left:-22px; right:-22px; height:30px; background:#8A63E8;
          border:5px solid #1A0F2E; border-radius:8px 8px 0 0; }
  .mans .w { position:absolute; width:34px; height:40px; background:#FFC93C; border:4px solid #1A0F2E;
          border-radius:5px; box-shadow:0 0 26px rgba(255,201,60,.9); }
  .mans .door { position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:52px; height:56px;
          background:#3A2A66; border:4px solid #1A0F2E; border-radius:8px 8px 0 0; }

  /* ============ 1. ICON ============ */
  .icon { width:320px; height:320px; border-radius:26px; position:relative; overflow:hidden;
          border:6px solid #1A0F2E; flex:none; }
  .icon .bg { position:absolute; inset:0; background:radial-gradient(circle at 50% 40%, #FFD84D, #FF8A1E 52%, #E0431C); }
  .icon .rays { position:absolute; inset:-40%;
      background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.30) 0deg 9deg, transparent 9deg 22deg); }
  .icon .cash { position:absolute; width:46px; height:30px; background:#3DDC5B; border:4px solid #1A0F2E;
      border-radius:5px; }
  .icon .head { position:absolute; top:56px; left:50%; transform:translateX(-50%); }
  .icon .ttl { position:absolute; bottom:12px; left:0; right:0; text-align:center; line-height:.92;
      font-family:"Luckiest Guy",Impact,sans-serif; }
  .icon .ttl .a { display:block; font-size:40px; color:#FFE96B; -webkit-text-stroke:8px #1A0F2E; paint-order:stroke fill; }
  .icon .ttl .b { display:block; font-size:52px; color:#fff;    -webkit-text-stroke:9px #1A0F2E; paint-order:stroke fill; }
  .icon .flag { position:absolute; top:14px; left:50%; transform:translateX(-50%) rotate(-3deg);
      background:linear-gradient(#FF7A7A,#E01F1F); border:4px solid #1A0F2E; border-radius:10px;
      box-shadow:0 5px 0 #8E0F0F; padding:5px 15px; white-space:nowrap;
      font-family:"Luckiest Guy",Impact,sans-serif; font-size:17px; }

  .note { flex:1; }
  .note h3 { font-family:"Luckiest Guy",Impact,sans-serif; font-size:21px; color:#FFC93C; margin-bottom:11px; }
  .note li { list-style:none; font-size:14.5px; color:#cfc4ec; line-height:1.55; margin-bottom:10px;
             padding-left:20px; position:relative; }
  .note li:before { content:"\25B8"; position:absolute; left:0; color:#FFC93C; }
  .note b { color:#fff; }

  /* ============ 2. HUD ============ */
  .hud { width:952px; height:560px; }

  /* left icon rail - the sim-game standard */
  .rail { position:absolute; left:16px; top:266px; display:flex; flex-direction:column; gap:9px; }
  .rbtn { width:58px; height:58px; border:4px solid #1A0F2E; border-radius:15px; position:relative;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  .rbtn .ci { width:26px; height:26px; }
  .rbtn .cl { font-family:"Luckiest Guy",Impact,sans-serif; font-size:9px; letter-spacing:.5px; }
  .dot { position:absolute; top:-6px; right:-6px; min-width:22px; height:22px; border-radius:11px;
         background:#FF3B3B; border:3px solid #1A0F2E; font-family:"Luckiest Guy",Impact,sans-serif;
         font-size:11px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

  /* crew roster */
  .crew { position:absolute; left:16px; top:16px; display:flex; flex-direction:column; gap:7px; }
  .mate { width:216px; display:flex; align-items:center; gap:9px; background:#3A2A66;
          border:4px solid #1A0F2E; border-radius:14px; padding:5px 10px 5px 6px; }
  .mate .av { width:34px; height:34px; border-radius:9px; background:#523D8F; border:3px solid #1A0F2E;
          display:flex; align-items:center; justify-content:center; flex:none; }
  .mate .av svg { width:19px; height:19px; }
  .mate .nm { font-size:13.5px; line-height:1.15; }
  .mate .rl { font-family:"Luckiest Guy",Impact,sans-serif; font-size:11px; color:#FFC93C; letter-spacing:.6px; }
  .mate .hp { margin-top:3px; width:100%; height:7px; background:#1A0F2E; border-radius:4px; overflow:hidden; }
  .mate .hp i { display:block; height:100%; background:#3DDC5B; }
  .mate.down { background:#5A2436; }
  .mate.down .rl { color:#FF8A8A; }
  .mate.down .hp i { background:#FF3B3B; }

  /* cash */
  .cashbox { position:absolute; top:16px; right:16px; display:flex; align-items:center;
      background:linear-gradient(#6BF08A,#22B845); border:5px solid #1A0F2E; border-radius:16px;
      padding:6px 8px 6px 14px; gap:10px; box-shadow:0 6px 0 #147A2C; }
  .cashbox .n { font-family:"Luckiest Guy",Impact,sans-serif; font-size:32px; color:#fff;
      -webkit-text-stroke:4px #0B3D19; paint-order:stroke fill; }
  .cashbox .plus { width:36px; height:36px; border-radius:11px; background:linear-gradient(#FFDD73,#FFAE18);
      border:4px solid #1A0F2E; font-family:"Luckiest Guy",Impact,sans-serif; font-size:24px; color:#3A2200;
      display:flex; align-items:center; justify-content:center; line-height:1; }
  .x2 { position:absolute; top:74px; right:16px; background:linear-gradient(#FF9AE8,#C22ED0);
      border:4px solid #1A0F2E; border-radius:13px; box-shadow:0 5px 0 #7A1585; padding:5px 13px;
      font-family:"Luckiest Guy",Impact,sans-serif; font-size:15px; }

  /* alarm + timer */
  .alarmbar { position:absolute; inset:0; border:11px solid #FF3B3B; border-radius:14px; pointer-events:none;
      box-shadow:inset 0 0 70px rgba(255,59,59,.5); }
  .top { position:absolute; top:12px; left:50%; transform:translateX(-50%); text-align:center; width:330px; }
  .top .a { font-family:"Luckiest Guy",Impact,sans-serif; font-size:26px; color:#FF5252;
      -webkit-text-stroke:6px #1A0F2E; paint-order:stroke fill; }
  .top .t { font-family:"Luckiest Guy",Impact,sans-serif; font-size:58px; color:#fff; line-height:.95;
      -webkit-text-stroke:8px #1A0F2E; paint-order:stroke fill; }
  .tbar { height:16px; background:#1A0F2E; border:4px solid #1A0F2E; border-radius:9px; overflow:hidden; margin-top:2px; }
  .tbar i { display:block; height:100%; width:52%; background:linear-gradient(#FF9A9A,#E01F1F); }
  .top .c { font-family:"Luckiest Guy",Impact,sans-serif; font-size:12px; color:#FFC0C0; margin-top:4px; letter-spacing:2px; }

  /* toast */
  .toast { position:absolute; top:196px; left:50%; transform:translateX(-50%);
      background:linear-gradient(#7FD4FF,#1E9AE0); border:4px solid #1A0F2E; border-radius:13px;
      box-shadow:0 5px 0 #0F6296; padding:7px 17px; font-size:15px; color:#04314B;
      display:flex; align-items:center; gap:8px; }
  .toast svg { width:19px; height:19px; }

  /* objective */
  .obj { position:absolute; left:16px; bottom:24px; background:#3A2A66; border:4px solid #1A0F2E;
      border-radius:14px; padding:7px 15px; }
  .obj .h { font-family:"Luckiest Guy",Impact,sans-serif; font-size:11px; color:#8DF0A6; letter-spacing:2px; }
  .obj .t { font-size:16px; margin-top:1px; }

  /* vault crack bar */
  .vault { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); width:400px; text-align:center; }
  .vault .cap { font-family:"Luckiest Guy",Impact,sans-serif; font-size:18px; color:#FFC93C; margin-bottom:5px;
      -webkit-text-stroke:5px #1A0F2E; paint-order:stroke fill; display:flex; gap:8px; justify-content:center; align-items:center; }
  .vault .cap svg { width:20px; height:20px; -webkit-text-stroke:0; }
  .vbar { height:30px; background:#1A0F2E; border:5px solid #1A0F2E; border-radius:16px; overflow:hidden; }
  .vbar i { display:block; height:100%; width:68%; border-radius:11px;
      background:linear-gradient(#FFE68F,#FFAE18); box-shadow:0 0 22px rgba(255,201,60,.8); }
  .vault .k { font-size:12.5px; color:#cfc4ec; margin-top:5px; }
  .key { display:inline-block; background:#fff; color:#1A0F2E; border:3px solid #1A0F2E; border-radius:6px;
      padding:0 6px; font-family:"Luckiest Guy",Impact,sans-serif; font-size:12px; }

  /* push your luck */
  .luck { position:absolute; right:16px; bottom:22px; width:250px; background:#3A2A66;
      border:5px solid #1A0F2E; border-radius:18px; padding:12px; }
  .luck .h { font-family:"Luckiest Guy",Impact,sans-serif; font-size:15px; color:#FFC93C; text-align:center;
      margin-bottom:7px; }
  .luck .q { font-size:13.5px; color:#cfc4ec; line-height:1.4; text-align:center; margin-bottom:11px; }
  .luck .q b { color:#7BE894; }
  .luck .btn { padding:9px 4px; font-size:14px; margin-bottom:9px; }
  .luck .btn small { display:block; font-family:"Fredoka One"; font-size:11px; opacity:.85; letter-spacing:0; }

  /* ============ 3. CREW SELECT ============ */
  .cs { width:735px; height:430px; }
  .cs .ttl { position:absolute; top:16px; left:0; right:0; text-align:center;
      font-family:"Luckiest Guy",Impact,sans-serif; font-size:30px; color:#FFC93C;
      -webkit-text-stroke:7px #1A0F2E; paint-order:stroke fill; }
  .cs .bar { position:absolute; top:58px; left:50%; transform:translateX(-50%);
      background:#1A0F2E; border-radius:11px; padding:4px 16px; font-size:13px; color:#cfc4ec; }
  .roles { position:absolute; top:96px; left:22px; right:22px; display:flex; gap:12px; }
  .role { flex:1; background:#3A2A66; border:5px solid #1A0F2E; border-radius:17px; padding:12px 9px; text-align:center; }
  .role.sel { background:linear-gradient(#6A50B8,#4B3591); border-color:#FFC93C; }
  .role .ic { width:52px; height:52px; margin:0 auto 8px auto; border-radius:14px; background:#523D8F;
      border:4px solid #1A0F2E; display:flex; align-items:center; justify-content:center; }
  .role.sel .ic { background:linear-gradient(#FFDD73,#FFAE18); }
  .role .ic svg { width:28px; height:28px; color:#FFC93C; }
  .role.sel .ic svg { color:#3A2200; }
  .role .n { font-family:"Luckiest Guy",Impact,sans-serif; font-size:16px; margin-bottom:6px;
      -webkit-text-stroke:4px #1A0F2E; paint-order:stroke fill; }
  .role.sel .n { color:#FFC93C; }
  .role .d { font-size:12px; color:#cfc4ec; line-height:1.42; min-height:68px; }
  .role .tag { margin-top:8px; background:#1A0F2E; border-radius:9px; padding:3px 6px; font-size:11px; color:#a99bd4; }
  .role.sel .tag { background:#FFC93C; color:#3A2200; }
  .role .tag.open { background:#3DDC5B; color:#0B3D19; }
  .cs .go { position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
      padding:13px 62px; font-size:24px; }
  .cs .vt { position:absolute; bottom:30px; right:24px; font-size:12px; color:#a99bd4; }

  /* ============ 4. PAYOUT ============ */
  .po { width:735px; height:430px; }
  .po .burst { position:absolute; inset:-30%;
      background:repeating-conic-gradient(from 0deg at 50% 34%, rgba(255,201,60,.20) 0deg 8deg, transparent 8deg 20deg); }
  .po .k { position:absolute; top:20px; left:0; right:0; text-align:center;
      font-family:"Luckiest Guy",Impact,sans-serif; font-size:19px; color:#7BE894;
      -webkit-text-stroke:5px #1A0F2E; paint-order:stroke fill; }
  .po .big { position:absolute; top:42px; left:0; right:0; text-align:center;
      font-family:"Luckiest Guy",Impact,sans-serif; font-size:52px; color:#fff;
      -webkit-text-stroke:9px #1A0F2E; paint-order:stroke fill; }
  .lines { position:absolute; top:118px; left:40px; right:40px; }
  .ln { display:flex; justify-content:space-between; align-items:center; background:#3A2A66;
      border:4px solid #1A0F2E; border-radius:12px; padding:6px 14px; margin-bottom:6px; font-size:14.5px; }
  .ln .v { font-family:"Luckiest Guy",Impact,sans-serif; font-size:18px; color:#7BE894; }
  .ln.b { background:#4A3580; } .ln.b .v { color:#FFC93C; }
  .ln .kk { display:flex; align-items:center; gap:8px; }
  .ln svg { width:18px; height:18px; color:#FFC93C; }
  .tot { position:absolute; bottom:78px; left:40px; right:40px; display:flex; justify-content:space-between;
      align-items:center; background:linear-gradient(#FFDD73,#FFAE18); border:5px solid #1A0F2E;
      border-radius:16px; padding:8px 18px; box-shadow:0 6px 0 #A96D00; }
  .tot .k2 { font-family:"Luckiest Guy",Impact,sans-serif; font-size:22px; color:#3A2200; }
  .tot .v2 { font-family:"Luckiest Guy",Impact,sans-serif; font-size:38px; color:#fff;
      -webkit-text-stroke:6px #1A0F2E; paint-order:stroke fill; }
  .po .rk { position:absolute; bottom:22px; left:40px; font-size:12.5px; color:#cfc4ec; }
  .po .rb { position:absolute; bottom:14px; right:40px; padding:10px 26px; font-size:18px; }

  .foot { margin-top:28px; padding-top:14px; border-top:5px solid #1A0F2E; font-size:13px;
      color:#a99bd4; line-height:1.65; }
  .foot b { color:#FFC93C; }

</style></head><body><svg style="display:none">
